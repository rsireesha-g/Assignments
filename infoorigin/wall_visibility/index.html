<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <header>
        <h2 class="title">Wall Visualization</h2>
    </header>
    <div class="container">
        <!-- input data fields -->
        <div class="inputs_grid">
            <div>
                <label class="input_label">Number of Walls :</label>
                <input type="text" class="input_field" id="wall_number_input_field" placeholder="Eg: 5" min="1" max="15"
                    onchange="getWallNumber()" aria-label="Number of Walls">
                <p class="error" id="number_error"></p>
            </div>
            <div>
                <label class="input_label">Height of Walls :</label>
                <input type="text" class="input_field" id="wall_heights_input_field" placeholder="Eg: 4,1,5,2..."
                    onchange="getWallHeights()" aria-label="Height of Walls">
                <p class="error" id="heights_error"></p>
            </div>
        </div>
        <!-- wall visualization  -->
        <div class="wall_data_container">
            <div class="graph_container">
                <div class="person_left">
                    <div class="person_figure">
                        <div class="person_head"></div>
                        <div class="person_body">
                            <div class="left_hand"></div>
                            <div class="right_hand"></div>
                            <div class="main_body"></div>
                        </div>
                    </div>
                    <div class="visible_count left_side_visible_count"></div>

                </div>
                <!-- bar chart of number of walls vs wall heights  -->
                <div class="bar_chart_container">
                    <div class="bar_chart"></div>
                </div>
                <div class="person_right">
                    <div class="person_figure">
                        <div class="person_head"></div>
                        <div class="person_body">
                            <div class="left_hand"></div>
                            <div class="right_hand"></div>
                            <div class="main_body"></div>
                        </div>
                    </div>
                    <div class="visible_count right_side_visible_count"></div>
                </div>
            </div>
            <!-- display of wall visibility for persons -->
            <div class="visibility_data_flex">
                <div class="right_side_count">Walls visible from person on right = <span class="right_count"></span>
                </div>
                <div class="left_side_count">Walls visible from person on left = <span class="left_count"></span>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
