<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <header>
        <h2 class="title">Seat Booking Interface</h2>
    </header>
    <div class="container">

        <!-- input fileds -->
        <div class="inputs_grid_container">
            <div class="input_inner_flex">
                <label class="input_label">Seats Matrix :</label>
                <div class="input_and_error">
                    <input type="text" class="input_field" id="seat_matrix_input_field" placeholder="Eg:5*3"
                        oninput="this.value = this.value.replace(/[^0-9^*]/g, '')" onchange="getSeatsMatrix()">
                    <p class="error_msg" id="matrix_error"></p>
                </div>
            </div>
            <div class="input_inner_flex">
                <label class="input_label">No. of blocked seats :</label>
                <div class="input_and_error">
                    <input type="text" class="input_field" id="blocked_seat_input_field" disabled placeholder="Eg:2"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')" onchange="getBlockedSeats()"
                        pattern="[0-9]">
                    <p class="error_msg" id="blocked_seat_error"></p>
                </div>
            </div>
        </div>

        <!-- seat arrangement -->
        <div class="seats_arrangement">
        </div>

        <!-- booked count display -->
        <div class="booked_seats_count">
            <div class="input_inner_flex">
                <label class="input_label">Total no. of seats booked:</label>
                <div class="booked_count">0</div>
            </div>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
