<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <header>
        <h2 class="title">Card Matching Game</h2>
    </header>

    <div class="container">

        <!-- input field -->
        <div class="input_flex">
            <div class="input_inner_flex">
                <label class="input_label">No of Cards :</label>
                <div class="input_and_error">
                    <input type="text" class="input_field" placeholder="Eg:5"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')" onchange="getCardsNumber()">
                </div>
                <div class="input_condition">(Must be even) <span>(4-100)</span></div>
            </div>
            <p class="error_msg" id="input_error"></p>
        </div>

        <!-- cards display -->
        <div class="cards_container"></div>
    </div>
</body>
<script src="index.js"></script>

</html>
